name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamodb-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start pinned ephemeral DynamoDB Local
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/local/compose.yaml -p miles-metadata-contract up -d dynamodb
          address=$(docker compose -f deploy/local/compose.yaml -p miles-metadata-contract port dynamodb 8000)
          echo "MILES_DDB_LOCAL_ENDPOINT=http://${address}" >> "$GITHUB_ENV"
          echo "MILES_DDB_LOCAL_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Run shared contracts and fault tests against native DynamoDB
        run: go test -v -race -count=1 -timeout=10m ./internal/metadata/dynamodb ./internal/metadata/badger ./internal/storage/contracttest ./internal/readpath
      - name: Remove only this job's ephemeral fixtures
        if: always()
        run: docker compose -f deploy/local/compose.yaml -p miles-metadata-contract down --volumes --remove-orphans

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify evidence checksums in clean Linux checkout
        shell: bash
        run: |
          set -euo pipefail
          for evidence in \
            docs/testing/evidence/s3-warm-final-20261027 \
            docs/testing/evidence/w03-hai-03-s3-live-20261027; do
            echo "Verifying ${evidence}"
            (cd "$evidence" && sha256sum -c sha256sums.txt)
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet, test and build
        run: make check
      - name: Storage and runtime race checks
        run: go test -race ./internal/storage/... ./internal/metadata/... ./internal/manifest ./internal/engine ./internal/pack ./internal/cache ./internal/readpath ./internal/coordination/... ./internal/config ./internal/app ./internal/observability ./cmd/miles

  terraform-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Terraform (verify SHA256)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, pathlib, urllib.request, zipfile
          version = "1.15.2"
          base = f"https://releases.hashicorp.com/terraform/{version}/"
          name = f"terraform_{version}_linux_amd64.zip"
          archive = urllib.request.urlopen(base + name).read()
          checksums = urllib.request.urlopen(base + f"terraform_{version}_SHA256SUMS").read().decode()
          expected = next(line.split()[0] for line in checksums.splitlines() if line.split()[-1] == name)
          assert hashlib.sha256(archive).hexdigest() == expected
          dest = pathlib.Path("/tmp/miles-terraform")
          dest.mkdir(exist_ok=True)
          zipfile.ZipFile(io.BytesIO(archive)).extract("terraform", dest)
          (dest / "terraform").chmod(0o755)
          PY
          echo /tmp/miles-terraform >> "$GITHUB_PATH"
      - name: Format, initialize and validate
        run: |
          terraform fmt -check -recursive infra/terraform/cloud
          terraform -chdir=infra/terraform/cloud/bootstrap/state init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform/cloud/bootstrap/state validate
          terraform -chdir=infra/terraform/cloud/environments/dev init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform/cloud/environments/dev validate
      - name: Test dev lifecycle with mock AWS (no AWS API calls)
        run: terraform -chdir=infra/terraform/cloud/environments/dev test

      - name: Test deployment identity and session plan guards (offline)
        run: python3 -B -m unittest discover -s infra/terraform/cloud/scripts/tests -v

  benchmark-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate pricing and negative contract cases
        run: |
          go test ./internal/pricing ./cmd/pricingcheck
          go run ./cmd/pricingcheck
