# Include inside the nginx http {} context. Supply certificates outside Git.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/miles/tls/fullchain.pem;
    ssl_certificate_key /etc/miles/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    client_body_timeout 150s;
    keepalive_timeout 150s;
    merge_slashes off;
    underscores_in_headers on;

    location / {
        # No URI component or rewrite: preserve the original signed request URI.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
